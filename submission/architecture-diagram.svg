<svg xmlns="http://www.w3.org/2000/svg" width="792" height="612" viewBox="0 0 792 612">
<rect width="792" height="612" fill="#102d43"/>
<text x="34" y="46" fill="white" font-family="Arial" font-size="24" font-weight="bold">Datacenter Explorer: application architecture</text>
<text x="34" y="71" fill="white" font-family="Arial" font-size="11">Browser -> Sites dispatcher -> Worker -> D1 -> controlled OpenAI -> validated cited response</text>
<path d="M205.0,182 L395.0,220" fill="none" stroke="#78c9ed" stroke-width="2"/>
<path d="M585.0,182 L395.0,220" fill="none" stroke="#78c9ed" stroke-width="2"/>
<path d="M395.0,290 L147.5,328" fill="none" stroke="#78c9ed" stroke-width="2"/>
<path d="M395.0,290 L396.5,328" fill="none" stroke="#78c9ed" stroke-width="2"/>
<path d="M395.0,290 L642.5,328" fill="none" stroke="#78c9ed" stroke-width="2"/>
<rect x="45" y="112" width="320" height="70" rx="6" fill="#eff5f9"/>
<text x="205.0" y="134" text-anchor="middle" fill="#163b52" font-family="Arial" font-size="12">Browser: five React pages</text>
<text x="205.0" y="150" text-anchor="middle" fill="#163b52" font-family="Arial" font-size="10">Overview / countries / design / evidence / adviser</text>
<rect x="425" y="112" width="320" height="70" rx="6" fill="#eff5f9"/>
<text x="585.0" y="134" text-anchor="middle" fill="#163b52" font-family="Arial" font-size="12">Sites dispatcher: Sign in with ChatGPT</text>
<text x="585.0" y="150" text-anchor="middle" fill="#163b52" font-family="Arial" font-size="10">Trusted identity; deployment audience boundary</text>
<rect x="235" y="220" width="320" height="70" rx="6" fill="#eff5f9"/>
<text x="395.0" y="242" text-anchor="middle" fill="#163b52" font-family="Arial" font-size="12">Vinext Worker / API authorization</text>
<text x="395.0" y="258" text-anchor="middle" fill="#163b52" font-family="Arial" font-size="10">Viewer / editor / admin; same-team and revision checks</text>
<rect x="45" y="328" width="205" height="70" rx="6" fill="#eff5f9"/>
<text x="147.5" y="350" text-anchor="middle" fill="#163b52" font-family="Arial" font-size="12">Cloudflare D1: DB</text>
<text x="147.5" y="366" text-anchor="middle" fill="#163b52" font-family="Arial" font-size="10">Evidence, users, design revisions</text>
<rect x="294" y="328" width="205" height="70" rx="6" fill="#eff5f9"/>
<text x="396.5" y="350" text-anchor="middle" fill="#163b52" font-family="Arial" font-size="12">Shared deterministic model</text>
<text x="396.5" y="366" text-anchor="middle" fill="#163b52" font-family="Arial" font-size="10">Energy, finance, stress cases</text>
<rect x="540" y="328" width="205" height="70" rx="6" fill="#eff5f9"/>
<text x="642.5" y="350" text-anchor="middle" fill="#163b52" font-family="Arial" font-size="12">OpenAI Responses API</text>
<text x="642.5" y="366" text-anchor="middle" fill="#163b52" font-family="Arial" font-size="10">Server secret; 5 read-only tools</text>
<text x="34" y="486" fill="#d7e8f0" font-family="Arial" font-size="10">Approved World Bank adapter: editor refresh only; validated imports retain historical reporting period and retrieval time.</text>
<text x="34" y="502" fill="#d7e8f0" font-family="Arial" font-size="10">Adviser: authorize, rate-check, retrieve current D1 snapshot, calculate, call provider, validate citations, persist actual usage.</text>
<text x="34" y="518" fill="#d7e8f0" font-family="Arial" font-size="10">Untrusted source text cannot grant permissions. No passwords, arbitrary URL/SQL tools, transcript retention or client secrets.</text>
<text x="34" y="534" fill="#d7e8f0" font-family="Arial" font-size="10">Unknown inputs keep INSUFFICIENT EVIDENCE visible. Logs retain request/revision/hash metadata, not raw sensitive content.</text>
</svg>